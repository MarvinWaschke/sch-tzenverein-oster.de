backend:
  name: git-gateway
  branch: main

media_folder: "content/uploads"
public_folder: "/content/uploads"

locale: "de"

collections:
  - name: "termine"
    label: "Termine"
    files:
      - file: "content/termine.json"
        label: "Terminliste"
        name: "termine"
        fields:
          - label: "Termine"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Datum (z.B. 10.01.2026)", name: "date", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Zusatzinfo (optional)", name: "sub", widget: "string", required: false }

  - name: "verein"
    label: "Der Verein"
    files:
      - file: "content/verein.json"
        label: "Vorstand, Festvorstand & Könige"
        name: "verein"
        fields:
          - label: "Vorstand"
            name: "vorstand"
            widget: "object"
            fields:
              - { label: "Gruppenbild", name: "photo", widget: "image", required: false }
              - label: "Mitglieder"
                name: "members"
                widget: "list"
                summary: "{{fields.role}} — {{fields.name}}"
                fields:
                  - { label: "Rolle", name: "role", widget: "string" }
                  - { label: "Name", name: "name", widget: "string", required: false }
          - label: "Festvorstand"
            name: "festvorstand"
            widget: "object"
            fields:
              - { label: "Gruppenbild", name: "photo", widget: "image", required: false }
              - label: "Mitglieder"
                name: "members"
                widget: "list"
                summary: "{{fields.role}} — {{fields.name}}"
                fields:
                  - { label: "Rolle", name: "role", widget: "string" }
                  - { label: "Name", name: "name", widget: "string", required: false }
          - label: "Ehrenvorstandsmitglieder"
            name: "ehrenvorstand"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Anzahl aktive Jahre (optional)", name: "jahre", widget: "string", required: false, hint: "z.B. 25 Jahre — nicht das Startjahr" }
          - label: "Könige & Kaiser"
            name: "koenige"
            widget: "object"
            fields:
              - label: "Amtierendes Paar"
                name: "aktuellesPaar"
                widget: "object"
                fields:
                  - { label: "Jahr", name: "jahr", widget: "string" }
                  - { label: "Typ", name: "typ", widget: "select", options: ["Königspaar", "Kaiserpaar"] }
                  - { label: "Name(n)", name: "name", widget: "string" }
                  - { label: "Bild", name: "photo", widget: "image", required: false }
              - { label: "Gruppenbild Königspaar & Festvorstand", name: "gruppenbildFestvorstand", widget: "image", required: false }
              - label: "Chronik"
                name: "historie"
                widget: "list"
                summary: "{{fields.jahr}} — {{fields.name}}"
                fields:
                  - { label: "Jahr", name: "jahr", widget: "string" }
                  - { label: "Typ", name: "typ", widget: "select", options: ["Königspaar", "Kaiserpaar"] }
                  - { label: "Name(n)", name: "name", widget: "string" }

  - name: "jubilaeum"
    label: "Jubiläum 2026"
    files:
      - file: "content/jubilaeum.json"
        label: "Plakat & Ablaufplan"
        name: "jubilaeum"
        fields:
          - { label: "Plakat (Bild)", name: "posterImage", widget: "image", required: false, hint: "Am besten als JPG/PNG hochladen, Hochformat" }
          - label: "Ablaufplan"
            name: "ablaufplan"
            widget: "list"
            required: false
            summary: "{{fields.time}} — {{fields.title}}"
            fields:
              - { label: "Uhrzeit / Tag", name: "time", widget: "string" }
              - { label: "Programmpunkt", name: "title", widget: "string" }
              - { label: "Zusatzinfo (optional)", name: "sub", widget: "string", required: false }

  - name: "einstellungen"
    label: "Einstellungen"
    files:
      - file: "content/settings.json"
        label: "Website-Einstellungen"
        name: "settings"
        fields:
          - { label: "Header-Bild", name: "heroImage", widget: "image", required: false, hint: "Querformat empfohlen, mind. 1600px breit" }
          - { label: "Alt-Text (Bildbeschreibung)", name: "heroImageAlt", widget: "string", required: false }

  - name: "aktuelles"
    label: "Aktuelles"
    files:
      - file: "content/aktuelles.json"
        label: "Beiträge"
        name: "aktuelles"
        fields:
          - label: "Beiträge"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
              - { label: "Bild (optional)", name: "image", widget: "image", required: false }
              - { label: "Text", name: "text", widget: "text" }

  - name: "partner"
    label: "Partner"
    files:
      - file: "content/partner.json"
        label: "Partnerliste"
        name: "partner"
        fields:
          - label: "Partner"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Logo (optional)", name: "logo", widget: "image", required: false }
              - { label: "Adresse (optional)", name: "address", widget: "text", required: false, hint: "Mehrzeilig möglich, z.B. Straße + PLZ Ort" }
              - { label: "Website (optional)", name: "website", widget: "string", required: false, hint: "z.B. www.beispiel-firma.de" }
